<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>공부노트 — 노션 · 엑셀 · IELTS 강의</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F6F7FA;
  --surface:#FFFFFF;
  --ink:#16181F;
  --sub:#667085;
  --line:#E8EAF1;
  --line2:#D6DAE5;
  --primary:#4F46E5;
  --primary-deep:#4338CA;
  --primary-soft:#EEF0FE;
  --excel:#059669;
  --excel-deep:#047857;
  --excel-soft:#E6F5EF;
  --blue:#2563EB;
  --blue-soft:#EAF1FE;
  --amber:#F7C948;
  --amber-deep:#7C4A03;
  --amber-soft:#FFF6DD;
  --radius-lg:18px;
  --radius-md:13px;
  --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 1px 3px rgba(16,24,40,.05), 0 6px 20px rgba(16,24,40,.06);
  --font:'Pretendard','Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-mono:'JetBrains Mono','Pretendard',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.view{display:none;animation:fadeIn .35s ease;min-height:60vh}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* ── 탑바 ── */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-size:18.5px;font-weight:800;letter-spacing:-.03em}
.logo .dot{width:11px;height:11px;border-radius:3.5px;background:linear-gradient(135deg,var(--primary),#8B5CF6);transform:rotate(45deg);box-shadow:0 2px 6px rgba(79,70,229,.35)}
.nav{display:flex;align-items:center;gap:4px}
.nav a{padding:8px 16px;border-radius:99px;font-size:13.5px;font-weight:500;color:var(--sub);transition:all .18s}
.nav a:hover{color:var(--ink);background:#F1F3F8}
.nav a.active{color:var(--primary-deep);background:var(--primary-soft);font-weight:700}

/* ── 히어로 ── */
.hero{position:relative;padding:52px 0 6px;background:radial-gradient(900px 280px at 85% -30%,rgba(79,70,229,.07),transparent 60%),radial-gradient(700px 220px at -8% 120%,rgba(5,150,105,.05),transparent 55%)}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--sub);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);padding:7px 15px;border-radius:99px}
.hero .kicker b{color:var(--ink);font-weight:700}
.hero h1{font-size:clamp(30px,4.5vw,43px);font-weight:800;line-height:1.28;margin:18px 0 8px;letter-spacing:-.035em}
.hero h1 .hl{background:linear-gradient(180deg,transparent 62%,var(--amber-soft) 62%);padding:0 7px;border-radius:5px}
.hero p{color:var(--sub);font-size:15.5px}
.hero p b{color:var(--ink);font-weight:600}

/* ── 통계 스트립 ── */
.stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:32px 0 6px}
.sstat{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:18px 20px;display:flex;align-items:center;gap:14px}
.ss-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.sstat:nth-child(1) .ss-ico{background:var(--primary-soft)}
.sstat:nth-child(2) .ss-ico{background:var(--amber-soft)}
.sstat:nth-child(3) .ss-ico{background:var(--excel-soft)}
.ss-v{font-family:var(--font-mono);font-size:23px;font-weight:700;line-height:1.2}
.ss-v small{font-size:13px;color:var(--sub);font-weight:600}
.ss-k{font-size:12.5px;color:var(--sub)}
.sstat.grow{background:linear-gradient(135deg,#F8F9FD,#F3F4FE);border-color:#E3E5F6}

/* ── 섹션 헤더 ── */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:38px 0 16px;gap:12px}
.sec-head h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.sec-head .more{font-size:13.5px;color:var(--sub);font-weight:600}
.sec-head .more:hover{color:var(--primary)}

/* ── 강좌 카드 ── */
.course-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.course-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px 26px 22px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.course-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.cc-icon{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:16px}
.cc-notion .cc-icon{background:linear-gradient(135deg,#EEF0FE,#DFE3FD);color:var(--primary)}
.cc-excel .cc-icon{background:linear-gradient(135deg,#E6F5EF,#D2EEE1);color:var(--excel-deep)}
.course-card h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.course-card .cc-sub{color:var(--sub);font-size:13.5px;margin:5px 0 20px}
.progress{height:6px;background:#EEF0F5;border-radius:99px;overflow:hidden;margin-bottom:7px}
.progress i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.cc-notion .progress i{background:linear-gradient(90deg,#6366F1,#4F46E5)}
.cc-excel .progress i{background:linear-gradient(90deg,#10B981,#059669)}
.progress-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:16px}
.progress-label b{font-family:var(--font-mono);color:var(--ink);font-weight:700}
.cc-next{font-size:13px;color:var(--sub);margin-bottom:18px;flex:1}
.cc-next b{color:var(--ink);font-weight:600}
.cc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font-size:14.5px;font-weight:700;color:#fff;transition:all .18s}
.cc-btn .arr{transition:transform .18s}
.cc-btn:hover .arr{transform:translateX(3px)}
.cc-notion .cc-btn{background:var(--primary)}
.cc-notion .cc-btn:hover{background:var(--primary-deep);box-shadow:0 6px 16px rgba(79,70,229,.32)}
.cc-excel .cc-btn{background:var(--excel)}
.cc-excel .cc-btn:hover{background:var(--excel-deep);box-shadow:0 6px 16px rgba(5,150,105,.32)}

/* ── 미니 달력 ── */
.mini-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:22px 24px}
.card h2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.card .card-sub{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:5px}
.cal-dow span{text-align:center;font-size:11px;font-weight:700;color:var(--sub);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);position:relative}
.cal-cell.blank{visibility:hidden}
.cal-cell.weekend{color:#C3C9D6}
.cal-cell.today{font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--primary)}
.cal-cell.done{background:var(--amber);color:var(--amber-deep);font-weight:700;box-shadow:inset 0 0 0 1.5px rgba(124,74,3,.18)}
.cal-mini-legend{display:flex;align-items:center;gap:8px;margin-top:15px;font-size:12px;color:var(--sub)}
.swatch{width:14px;height:14px;border-radius:5px;background:var(--amber);display:inline-block;flex-shrink:0}

/* 최근 기록 */
.recent-list{display:flex;flex-direction:column}
.recent-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.recent-row:last-child{border-bottom:none;padding-bottom:2px}
.r-date{font-family:var(--font-mono);font-size:12px;color:var(--sub);min-width:60px}
.r-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.r-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.r-course{font-size:11px;color:var(--sub);flex-shrink:0;padding:3px 10px;border-radius:99px;font-weight:600}
.r-course.notion{color:var(--primary-deep);background:var(--primary-soft)}
.r-course.excel{color:var(--excel-deep);background:var(--excel-soft)}

/* ── 강좌 상세 ── */
.course-head{display:flex;align-items:center;gap:18px;padding:30px 0 22px;flex-wrap:wrap}
.ch-icon{width:58px;height:58px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:27px;flex-shrink:0}
.course-head h1{font-size:clamp(24px,3.4vw,30px);font-weight:800;letter-spacing:-.03em}
.course-head .ch-sub{color:var(--sub);font-size:14px;margin-top:3px}
.course-head .ch-meta{margin-left:auto;text-align:right}
.ch-pct{font-family:var(--font-mono);font-size:26px;font-weight:700}
.ch-pct small{font-size:13px;color:var(--sub)}
.back-btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--sub);padding:6px 2px;transition:color .15s}
.back-btn:hover{color:var(--primary)}
.chapter{margin-bottom:28px}
.chapter-tag{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chapter-tag .cno{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--sub);background:#F1F3F8;border:1px solid var(--line);padding:3px 10px;border-radius:99px;letter-spacing:.03em}
.chapter-tag .name{font-size:16px;font-weight:800;letter-spacing:-.02em}
.chapter-tag .chip{font-size:11.5px;padding:3px 10px;border-radius:99px;font-weight:700}
.lvl-basic .chip{background:var(--excel-soft);color:var(--excel-deep)}
.lvl-mid .chip{background:var(--blue-soft);color:var(--blue)}
.lvl-adv .chip{background:var(--primary-soft);color:var(--primary-deep)}
.lesson-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.lesson-row{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);transition:background .15s;cursor:pointer}
.lesson-row:last-child{border-bottom:none}
.lesson-row:hover{background:#FAFBFD}
.lesson-num{font-family:var(--font-mono);font-size:11.5px;color:var(--sub);background:#F1F3F8;border:1px solid var(--line);border-radius:7px;padding:2.5px 8px;min-width:36px;text-align:center;font-weight:600}
.lesson-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:all .15s;background:var(--surface)}
.lesson-row.is-done .lesson-check{border-color:var(--excel);background:var(--excel)}
.lesson-check svg{opacity:0;transform:scale(.5);transition:all .15s}
.lesson-row.is-done .lesson-check svg{opacity:1;transform:scale(1)}
.lesson-title{flex:1;font-size:15px;font-weight:600;color:var(--ink)}
.lesson-row.is-done .lesson-title{color:var(--sub);text-decoration:line-through;text-decoration-color:#C3C9D6}
.lesson-time{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:500}
.lesson-arrow{color:#C8CDD9;transition:all .15s}
.lesson-row:hover .lesson-arrow{transform:translateX(3px);color:var(--primary)}

/* ── 강의 상세 ── */
.lesson-detail{max-width:780px;margin:0 auto;padding:26px 0 60px}
.ld-bread{font-size:13px;color:var(--sub);margin:14px 0 26px;display:flex;align-items:center;gap:8px}
.ld-bread a:hover{color:var(--primary)}
.ld-bread .sep{color:var(--line2)}
.ld-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:32px 32px 26px;position:relative;overflow:hidden}
.ld-head::before{content:"";position:absolute;top:0;left:0;right:0;height:5px}
.ld-head.heart-notion::before{background:linear-gradient(90deg,#818CF8,#4F46E5)}
.ld-head.heart-excel::before{background:linear-gradient(90deg,#34D399,#059669)}
.ld-type{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:99px;margin-bottom:16px}
.ld-head.heart-notion .ld-type{background:var(--primary-soft);color:var(--primary-deep)}
.ld-head.heart-excel .ld-type{background:var(--excel-soft);color:var(--excel-deep)}
.ld-head h1{font-size:clamp(22px,3.2vw,29px);font-weight:800;line-height:1.35;letter-spacing:-.03em}
.ld-meta{display:flex;gap:18px;margin-top:15px;color:var(--sub);font-size:12.5px;align-items:center;font-weight:500}
.ld-meta .mono{font-family:var(--font-mono)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:24px 26px;margin-top:14px}
.block-h{display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:800;letter-spacing:-.02em;margin-bottom:13px}
.block-h .ico{width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13.5px;flex-shrink:0}
.block-h .ico.b1{background:var(--primary-soft);color:var(--primary)}
.block-h .ico.b2{background:var(--excel-soft);color:var(--excel-deep)}
.block-h .ico.b3{background:var(--amber-soft);color:var(--amber-deep)}
.block ul{list-style:none}
.block li{position:relative;padding:6.5px 0 6.5px 24px;font-size:14.5px;color:#3C4353}
.block li::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;border-radius:2.5px;background:var(--line2)}
.block ul.li-doc li::before{background:var(--primary)}
.block ul.li-grid li::before{background:var(--excel)}
.goal-box{border-radius:14px;padding:19px 22px;margin-top:16px;display:flex;gap:14px;align-items:flex-start}
.goal-box.n{background:linear-gradient(180deg,#F7F8FF,#EEF0FE);border:1px solid #DFE2FC}
.goal-box.xl{background:linear-gradient(180deg,#F6FBF8,#E6F5EF);border:1px solid #C9EBDA}
.goal-box .g-ico{font-size:20px;margin-top:1px}
.goal-box b{display:block;font-size:13.5px;margin-bottom:4px;font-weight:800}
.goal-box p{font-size:14.5px;color:#3C4353}
.done-zone{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px;background:var(--surface);border:1px dashed var(--line2);border-radius:16px}
.done-btn{display:inline-flex;align-items:center;gap:9px;padding:14px 32px;border-radius:13px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#10B981,#059669);transition:all .18s;box-shadow:0 4px 14px rgba(5,150,105,.3)}
.done-btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(5,150,105,.38)}
.done-btn.done{background:#F1F3F8;color:var(--sub);box-shadow:none}
.done-zone .dz-hint{font-size:12.5px;color:var(--sub)}
.lesson-nav{display:flex;justify-content:space-between;gap:14px;margin-top:16px}
.lnav{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;transition:all .15s}
.lnav:hover{border-color:#CFD2F5;box-shadow:var(--shadow-sm)}
.lnav.right{text-align:right}
.lnav .l-label{font-size:11.5px;color:var(--sub);font-weight:700}
.lnav .l-title{font-size:13.5px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnav.right .l-title{color:var(--primary-deep)}

/* ── 달력 페이지 ── */
.cal-page-head{display:flex;align-items:center;justify-content:space-between;padding:36px 0 6px;flex-wrap:wrap;gap:14px}
.cal-page-head h1{font-size:clamp(24px,3.4vw,31px);font-weight:800;letter-spacing:-.03em}
.cal-page-head .cp-sub{color:var(--sub);font-size:14px;margin-top:3px}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;font-size:17px;transition:all .15s;color:var(--ink)}
.cal-nav button:hover{background:#F1F3F8}
.cal-nav .ym{font-size:16px;font-weight:800;min-width:120px;text-align:center;letter-spacing:-.02em}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:18px 20px}
.stat .s-v{font-family:var(--font-mono);font-size:26px;font-weight:700;line-height:1.2}
.stat .s-v small{font-size:15px;color:var(--sub)}
.stat .s-k{font-size:12.5px;color:var(--sub);margin-top:3px}
.cal-big{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:24px 26px}
.cal-big .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.cal-big .dow span{text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:8px 0}
.cal-big .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-big .day{min-height:92px;border-radius:12px;border:1px solid var(--line);padding:9px 10px;position:relative;transition:all .15s;background:var(--surface)}
.cal-big .day.out{opacity:.35;background:#FAFBFD}
.cal-big .day.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal-big .d-n{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--sub)}
.cal-big .day.today .d-n{color:#fff;background:var(--primary);border-radius:7px;width:25px;height:25px;display:flex;align-items:center;justify-content:center}
.cal-big .d-wk{position:absolute;bottom:7px;right:8px;font-size:9px;color:#C3C9D6;font-weight:700}
.cal-big .day.done{background:linear-gradient(180deg,#FFF8E5,#FFEFC6);border-color:#F0DEA0}
.cal-big .day.done .d-n{color:var(--amber-deep)}
.cal-big .d-marks{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.cal-big .mk{font-size:9.5px;font-weight:700;border-radius:99px;padding:2.5px 7px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-big .mk.n{background:var(--primary-soft);color:var(--primary-deep)}
.cal-big .mk.x{background:var(--excel-soft);color:var(--excel-deep)}
.cal-big .mk.i{background:var(--ielts-soft);color:var(--ielts-deep)}
.cal-legend{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.cal-legend .lg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);background:#F1F3F8;border:1px solid var(--line);padding:6px 13px;border-radius:99px;font-weight:500}
.cal-legend .lg .swatch{width:13px;height:13px;border-radius:4.5px}

/* ── 토스트 ── */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1D222E;color:#fff;padding:13px 24px;border-radius:13px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.28);display:flex;align-items:center;gap:9px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{border-top:1px solid var(--line);margin-top:70px;padding:34px 0 48px;color:#9AA1B0;font-size:12.5px;text-align:center;font-weight:500}

/* ── 자격증 & 유튜브 ── */
.cert-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:24px 26px;margin:20px 0 8px}
.cert-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cert-badge{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;background:linear-gradient(135deg,#FFF4D6,#FFE9B8)}
.cert-head .ct{font-size:17px;font-weight:800;letter-spacing:-.02em}
.cert-head .co{font-size:12.5px;color:var(--sub);font-weight:600}
.cert-head .cert-lnk{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--primary-deep);background:var(--primary-soft);padding:7px 14px;border-radius:99px;display:inline-flex;align-items:center;gap:6px}
.cert-step{display:flex;gap:13px;padding:13px 0;border-bottom:1px dashed var(--line)}
.cert-step:last-of-type{border-bottom:none;padding-bottom:2px}
.cert-step .cs-no{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--primary-deep);background:var(--primary-soft);border-radius:7px;padding:3px 8px;height:fit-content;flex-shrink:0;margin-top:2px}
.cert-step b{font-size:14px;display:block}
.cert-step p{font-size:13px;color:#3C4353;margin-top:2px}
.cert-note{font-size:12.5px;color:var(--sub);background:#F8F9FD;border:1px solid var(--line);border-radius:11px;padding:10px 14px;margin-top:12px}
.yt-block{margin-top:14px}
.yt-head{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;letter-spacing:-.02em;margin-bottom:11px}
.yt-head .y-ico{width:27px;height:27px;border-radius:8px;background:#FFE8E8;color:#E5484D;display:flex;align-items:center;justify-content:center;font-size:13px}
.yt-item{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:9px;transition:all .15s;text-align:left;width:100%}
.yt-item:hover{border-color:#FFC2C2;box-shadow:var(--shadow-sm)}
.yt-item .yt-thumb{width:88px;height:50px;border-radius:9px;background:linear-gradient(135deg,#FF5B5B,#C1121F);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.yt-item .yt-info{flex:1;min-width:0}
.yt-item .yt-info b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yt-item .yt-info .yt-ch{font-size:11.5px;color:var(--sub);font-weight:600}
.yt-item .yt-ts{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:#fff;background:#E5484D;border-radius:8px;padding:5px 10px;flex-shrink:0;white-space:nowrap}
.cc-cert{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--amber-deep);background:var(--amber-soft);border:1px solid #F0DEA0;padding:4px 10px;border-radius:99px;white-space:nowrap}
@media(max-width:560px){
  .cert-card{padding:18px 16px}
  .cert-head .cert-lnk{margin-left:0}
  .yt-item{flex-wrap:wrap;gap:9px}
  .yt-item .yt-ts{margin-left:auto}
}

/* ── 그림으로 이해하기 ── */
.dg-btn{display:flex;align-items:center;gap:9px;width:100%;padding:13px 18px;margin-top:16px;border:1.5px dashed var(--line2);border-radius:14px;background:var(--surface);font-size:15px;font-weight:800;color:var(--ink);transition:all .18s;flex-wrap:wrap;text-align:left}
.dg-btn:hover{border-color:var(--primary);color:var(--primary-deep);background:var(--primary-soft)}
.dg-btn .arr{transition:transform .2s;margin-left:auto;font-size:13px}
.dg-btn.open .arr{transform:rotate(180deg)}
.dg-btn .dg-btn-s{font-size:11.5px;color:var(--sub);font-weight:600}
.dg-wrap{display:none;margin-top:12px}
.dg-wrap.open{display:block;animation:fadeIn .3s ease}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm)}
.diagram svg{width:100%;height:auto;display:block}
.diagram text{font-family:var(--font)}
.dg-caption{font-size:12.5px;color:var(--sub);margin-top:12px;text-align:center}
.dg-caption b{color:var(--ink)}
@media(max-width:560px){.dg-btn{padding:12px 13px;font-size:14px}.diagram{padding:10px}}

/* ── IELTS 강좌 ── */
:root{--ielts:#E11D48;--ielts-deep:#BE123C;--ielts-soft:#FFE9EE;--ielts-line:#F8B4C6}
.cc-ielts .cc-icon{background:linear-gradient(135deg,#FFE9EE,#FBC4D4);color:var(--ielts)}
.cc-ielts .progress i{background:linear-gradient(90deg,#F43F5E,#E11D48)}
.cc-ielts .cc-btn{background:var(--ielts)}
.cc-ielts .cc-btn:hover{background:var(--ielts-deep);box-shadow:0 6px 16px rgba(225,29,72,.32)}
.ld-head.heart-ielts::before{background:linear-gradient(90deg,#FB7185,#E11D48)}
.ld-head.heart-ielts .ld-type{background:var(--ielts-soft);color:var(--ielts-deep)}
.goal-box.ielts{background:linear-gradient(180deg,#FFF1F5,#FFE4EC);border:1px solid #F8B4C6}
.goal-box.ielts .g-ico{color:var(--ielts)}
.r-course.ielts{color:var(--ielts-deep);background:var(--ielts-soft)}
.cert-badge.ielts{background:linear-gradient(135deg,#FFE9EE,#FBC4D4)}
.cc-cert.ielts{color:var(--ielts-deep);background:var(--ielts-soft);border-color:#F8B4C6}


/* ── 핵심 포인트 토글 설명 ── */
.block-h .ico.b4{background:var(--ielts-soft);color:var(--ielts-deep)}
.point-guide{display:flex;flex-direction:column;gap:10px}
.ptoggle{background:#FBFCFF;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .18s, box-shadow .18s, background .18s}
.ptoggle[open]{background:var(--surface);box-shadow:var(--shadow-sm)}
.point-guide.notion .ptoggle[open]{border-color:#D9DCFC}
.point-guide.excel .ptoggle[open]{border-color:#BFE4D1}
.point-guide.ielts .ptoggle[open]{border-color:#F5B4C3}
.ptoggle summary{list-style:none;display:flex;align-items:flex-start;gap:12px;padding:14px 16px;cursor:pointer}
.ptoggle summary::-webkit-details-marker{display:none}
.pt-no{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:800;flex-shrink:0;background:#F1F3F8;color:var(--sub);margin-top:1px}
.point-guide.notion .pt-no{background:var(--primary-soft);color:var(--primary-deep)}
.point-guide.excel .pt-no{background:var(--excel-soft);color:var(--excel-deep)}
.point-guide.ielts .pt-no{background:var(--ielts-soft);color:var(--ielts-deep)}
.pt-sum{flex:1;min-width:0}
.pt-sum b{display:block;font-size:14.5px;line-height:1.5;color:var(--ink)}
.pt-sum span{display:block;font-size:12px;color:var(--sub);margin-top:3px}
.pt-arr{margin-left:auto;color:var(--sub);font-size:13px;transition:transform .18s;line-height:1;padding-top:6px}
.ptoggle[open] .pt-arr{transform:rotate(180deg)}
.pt-body{padding:0 16px 16px 16px}
.pt-copy{border-top:1px dashed var(--line);padding-top:14px}
.pt-copy p{font-size:13.6px;color:#3C4353;margin:0 0 8px;line-height:1.72}
.pt-copy p:last-child{margin-bottom:0}
.pt-copy b{color:var(--ink)}
.pt-mini{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#F8FAFD;padding:11px 11px 8px}
.pt-mini-cap{font-size:11.5px;font-weight:800;color:var(--sub);margin-bottom:8px}
.pt-mini-art{border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.pt-mini-art svg{display:block;width:100%;height:auto;max-height:220px}
.pt-mini-note{font-size:11.5px;color:var(--sub);margin-top:8px;text-align:center}
.pt-hint{margin-top:10px;padding:10px 12px;border-radius:11px;font-size:12.2px;color:#4A5160;background:#F7F8FC;border:1px solid var(--line)}
.point-guide.ielts .pt-hint{background:#FFF3F6;border-color:#F6C6D2}
@media(max-width:560px){
  .ptoggle summary{padding:12px 13px;gap:10px}
  .pt-no{width:25px;height:25px;border-radius:8px;font-size:10px}
  .pt-sum b{font-size:13.5px}
  .pt-copy p{font-size:12.9px}
  .pt-body{padding:0 13px 13px}
  .pt-mini{padding:9px 9px 7px}
}

const LS_KEY = 'studyNote_done_v1';
let done = {};
try { done = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e) { done = {}; }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(done)); }
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const pad = n => String(n).padStart(2,'0');
const fmtDate = s => { const [y,m,d] = s.split('-'); return y+'년 '+Number(m)+'월 '+Number(d)+'일'; };

/* ── 강의 색상 헬퍼 ── */
function colorOf(courseId){ return courseId==='notion' ? 'notion' : (courseId==='ielts' ? 'ielts' : 'excel'); }
function doneDates(){ return [...new Set(Object.values(done))].sort(); }
function completedOf(courseId){
  const prefix = courseId==='notion' ? 'n' : (courseId==='ielts' ? 'i' : 'x');
  return Object.keys(done).filter(id => id.startsWith(prefix));
}
function flatLessons(cid){
  const c = COURSES[cid]; const out = [];
  c.chapters.forEach((ch,ci)=>{ ch.lessons.forEach(les=> out.push({...les, cid: cid, chName: ch.name})); });
  return out;
}
function lessonIndex(cid, lid){
  return flatLessons(cid).findIndex(l => l.id === lid);
}
function streakDays(){
  const dates = doneDates();
  if(!dates.length) return 0;
  const set = new Set(dates);
  let n = 0; const cur = new Date();
  if(!set.has(todayStr())) cur.setDate(cur.getDate()-1);
  while(set.has(cur.getFullYear()+'-'+pad(cur.getMonth()+1)+'-'+pad(cur.getDate()))){
    n++; cur.setDate(cur.getDate()-1);
  }
  return n;
}
function doneCountOfMonth(y, m){
  const prefix = y+'-'+pad(m);
  return doneDates().filter(d => d.startsWith(prefix)).length;
}

let calOffset = 0;
function parseHash(){
  const h = location.hash.replace(/^#/,'') || 'home';
  const parts = h.split('/');
  if(parts[0]==='course') return {v:'course', cid: parts[1]};
  if(parts[0]==='lesson') return {v:'lesson', cid: parts[1], lid: parts[2]};
  if(parts[0]==='calendar') return {v:'calendar'};
  return {v:'home'};
}
function route(){
  const r = parseHash();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el = document.getElementById('view-'+r.v);
  el.classList.add('active');
  el.innerHTML = render[r.v](r);
  document.querySelectorAll('#nav a, #tabbar a').forEach(a=>a.classList.toggle('active', a.dataset.nav=== (r.v==='course'? r.cid : r.v==='home'?'home':r.v)));
  window.scrollTo({top:0});
}
window.addEventListener('hashchange', route);

/* ── 유튜브 헬퍼 ── */
function fmtTS(sec){
  sec = Math.floor(sec||0);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s2 = sec%60;
  return (h? h+':'+String(m).padStart(2,'0') : m) + ':' + String(s2).padStart(2,'0');
}
function ytItem(y){
  const t = y.e ? fmtTS(y.s)+' ~ '+fmtTS(y.e) : (y.s ? fmtTS(y.s)+' ~' : '전체 영상');
  return `<a class="yt-item" href="https://www.youtube.com/watch?v=${y.id}${y.s?'&t='+Math.floor(y.s)+'s':''}" target="_blank" rel="noopener">
      <span class="yt-thumb">▶</span>
      <span class="yt-info"><b>${y.v}</b><span class="yt-ch">${y.ch}</span></span>
      <span class="yt-ts">${t}</span></a>`;
}
function ytBlock(arr){
  if(!arr || !arr.length) return '';
  return `<div class="yt-block"><div class="yt-head"><span class="y-ico">▶</span>관련 영상으로 복습해요</div>` + arr.map(ytItem).join('') + `</div>`;
}
function courseK(cid){ return cid==='notion' ? '노션' : (cid==='excel' ? '엑셀' : 'IELTS'); }
function hasAny(text, arr){ return arr.some(k => text.includes(k)); }
function pointMeaning(les, point){

  if(hasAny(point,['철자','spell','받아쓰기','숫자','날짜','시간'])) return '이 항목은 들리는 소리만 대충 넘기지 말고, 숫자·이름·날짜처럼 틀리기 쉬운 정보를 정확한 글자 단위로 붙잡으라는 뜻이에요.';

  if(hasAny(point,['발음','강세','연음','억양','th','모음'])) return '이 포인트는 영어 소리를 입 모양과 리듬까지 포함해서 익히라는 뜻이에요. 단어만 아는 것보다 실제 소리를 구별하는 힘이 더 중요해요.';

  if(hasAny(point,['수식','함수','SUM','AVERAGE','COUNT','IF','VLOOKUP','INDEX','MATCH','TODAY','DATEDIF','dateBetween','prop('])) return '이 포인트는 사람이 매번 손으로 계산하지 말고, 규칙을 한 번 만들어 자동으로 계산하게 하라는 뜻이에요.';
  if(hasAny(point,['드래그','복사','절대 참조','상대 참조','F4','자동 채우기'])) return '이 내용은 같은 작업을 더 빠르게 반복하기 위한 조작 요령이에요. 한 번 정확히 해 두면 이후 작업량이 크게 줄어요.';
  if(hasAny(point,['차트','피벗','데이터베이스','관계','롤업','템플릿','매크로'])) return '이 항목은 데이터를 한 단계 더 체계적으로 다루는 고급 도구를 뜻해요. 처음에는 어렵지만, 원리를 이해하면 시간을 많이 아낄 수 있어요.';
  if(hasAny(point,['공유','권한','댓글','멘션','협업','히스토리'])) return '이 포인트는 혼자 쓰는 문서를 넘어, 다른 사람과 안전하게 함께 일하는 방법을 뜻해요.';
  if(hasAny(point,['오답','복습','점검','자가 채점','분석','모의'])) return '이 항목은 단순히 한 번 끝내는 것이 아니라, 틀린 이유를 찾아 다음 실수를 줄이는 훈련이에요.';
  if(hasAny(point,['편지','Task 1','에세이','Task 2','라이팅','연결어','시제','문법'])) return '이 포인트는 글을 예쁘게 쓰는 것보다, 채점 기준에 맞게 구조와 문장을 안정적으로 만드는 연습이라고 보면 돼요.';
  if(hasAny(point,['스피킹','큐카드','발화','파트 1','파트 2','파트 3'])) return '이 내용은 긴 답을 외우기보다, 짧은 구조를 잡고 자연스럽게 이어 말하는 힘을 기르는 포인트예요.';

}
function pointWhy(les, point){
  if(les.cid==='ielts'){

    if(hasAny(point,['철자','spell','받아쓰기','숫자','날짜','시간'])) return '리스닝에서는 내용을 알아들었어도 철자 하나 틀리면 오답이 되기 쉬워요. 특히 이름·전화번호·날짜는 정확도가 점수로 바로 이어집니다.';
    if(hasAny(point,['발음','강세','연음','억양','th','모음'])) return '내가 소리를 정확히 낼 수 있어야 남의 소리도 더 잘 들립니다. 발음 훈련은 스피킹뿐 아니라 리스닝에도 직접 도움이 돼요.';
    if(hasAny(point,['오답','복습','점검','자가 채점','분석','모의'])) return '점수는 연습량보다 오답 분석의 질에서 크게 올라가요. 어디서 놓쳤는지 알아야 같은 함정에 다시 안 걸립니다.';
    return '시험에서는 “아는 것”보다 “짧은 시간 안에 꺼내 쓰는 것”이 중요해요. 그래서 핵심 포인트를 짧고 명확한 행동으로 익혀 두어야 합니다.';
  }
  if(les.cid==='excel'){
    if(hasAny(point,['수식','함수','SUM','AVERAGE','COUNT','IF','VLOOKUP','INDEX','MATCH','TODAY','DATEDIF'])) return '엑셀은 한 번 정확한 공식을 만들면 같은 계산을 수십 번, 수백 번 반복하지 않아도 돼요. 실무 속도 차이가 여기서 크게 납니다.';
    if(hasAny(point,['드래그','복사','절대 참조','상대 참조','F4','자동 채우기'])) return '엑셀은 복사 한 번으로 표 전체가 바뀌기 때문에, 참조 방식이 틀리면 결과가 전부 어긋날 수 있어요. 작은 차이를 정확히 아는 것이 중요해요.';
    if(hasAny(point,['차트','피벗','정렬','필터','표'])) return '정리되지 않은 데이터는 읽기도 어렵고 실수도 많아요. 보기 좋게 정리하면 바로 보고 판단할 수 있는 자료가 됩니다.';
    return '엑셀은 클릭 순서와 셀 참조가 아주 중요해요. 오늘 배운 원리를 손에 익혀 두면 다음 작업에서도 그대로 재사용할 수 있습니다.';
  }
  if(hasAny(point,['관계','롤업','데이터베이스','필터','정렬','뷰'])) return '노션은 정보가 많아질수록 구조가 더 중요해져요. 정리 원리를 일찍 잡아 두면 페이지가 늘어나도 덜 헷갈립니다.';
  if(hasAny(point,['공유','권한','댓글','멘션','협업','히스토리'])) return '노션은 혼자 메모할 때보다 함께 쓸 때 힘이 커져요. 권한과 협업 기능을 이해하면 실수 없이 같이 일할 수 있어요.';
  return '노션은 눈으로 보기에는 쉬워 보여도, 블록·DB·속성 같은 기본 원리를 이해해야 오래 써도 깔끔하게 유지할 수 있어요.';
}
function pointHow(les, point){

    if(hasAny(point,['오답','복습','점검','자가 채점','분석','모의'])) return '틀린 문제는 정답만 보지 말고 “어느 단어에서 놓쳤는지, 왜 다른 선택지를 골랐는지”를 한 줄로 적으세요. 그 한 줄이 다음 점수를 올려 줍니다.';

  }
  if(les.cid==='excel'){
    if(hasAny(point,['수식','함수','SUM','AVERAGE','COUNT','IF','VLOOKUP','INDEX','MATCH','TODAY','DATEDIF'])) return '작은 표를 직접 만들고 공식을 한 칸에 먼저 완성한 뒤, 복사했을 때도 결과가 맞는지 꼭 확인해 보세요. “왜 이 범위를 잡았는지”를 입으로 설명해 보면 더 빨리 익습니다.';
    if(hasAny(point,['드래그','복사','절대 참조','상대 참조','F4','자동 채우기'])) return '예제 표에서 한 칸만 먼저 계산한 뒤 아래로 복사해 보세요. 값이 어긋나면 어떤 주소가 움직였는지 직접 비교하면 감이 빨리 잡혀요.';
    if(hasAny(point,['차트','피벗','정렬','필터','표','드롭다운'])) return '원본 데이터를 5~10행 정도만 만들어 놓고 직접 클릭 순서를 따라 해 보세요. 화면에서 어떤 버튼이 결과를 바꾸는지 한 번 경험해 보면 실무에서 바로 써먹기 쉬워집니다.';
    return '손으로 따라 하는 것이 가장 중요해요. 설명을 읽은 뒤 3분 안에 같은 화면을 다시 만들어 보는 식으로 짧게 복습해 보세요.';
  }
  if(hasAny(point,['관계','롤업','데이터베이스','필터','정렬','뷰'])) return '새 페이지를 만들기보다 작은 예제 DB를 하나 만들어 직접 클릭해 보세요. 항목 3~5개만 넣어도 구조가 어떻게 바뀌는지 바로 체감할 수 있어요.';
  if(hasAny(point,['공유','권한','댓글','멘션','협업','히스토리'])) return '혼자 연습할 때도 괜찮아요. 같은 페이지를 다른 브라우저나 모바일로 열어 보고, 공유 메뉴를 눌러 어떤 옵션이 있는지 직접 확인해 보세요.';
  return '노션은 “읽기”보다 “만지기”가 더 중요해요. 오늘 포인트를 보고 바로 같은 블록이나 DB를 하나 만들어 보는 방식으로 연습해 보세요.';
}
function pointCaution(les, point){
  if(les.cid==='ielts'){
    if(hasAny(point,['NOT GIVEN','False','TRUE','T/F/NG'])) return '주의할 점은 “내 상식”으로 답을 고르지 않는 거예요. 지문에 없으면 모르는 것이고, 반대로 말했을 때만 FALSE예요.';
    if(hasAny(point,['철자','spell','받아쓰기','숫자','날짜','시간'])) return '자주 하는 실수는 소리는 알아들었는데 표기 규칙을 틀리는 거예요. 답안지로 옮길 때 대소문자, 복수형, 단어 수 제한도 같이 확인하세요.';
    if(hasAny(point,['서론','본론','결론','편지','에세이','Task 1','Task 2'])) return '글을 길게 쓰는 것보다 구조가 먼저예요. 시간이 부족해도 서론·본론·결론 뼈대는 꼭 지키는 습관을 들이세요.';
    return '중요한 것은 완벽주의보다 일관성입니다. 한 문제를 오래 끌기보다, 지금 배운 전략을 같은 방식으로 여러 번 적용해 보세요.';
  }
  if(les.cid==='excel'){
    if(hasAny(point,['수식','함수','절대 참조','상대 참조','F4'])) return '가장 흔한 실수는 범위를 잘못 잡고도 눈치채지 못하는 거예요. 값이 맞는지 한 셀씩 확인하는 습관을 꼭 들이세요.';
    if(hasAny(point,['매크로'])) return '매크로는 편하지만, 저장 형식이 .xlsm인지와 보안 경고를 꼭 확인해야 해요. 출처가 불분명한 코드는 바로 실행하지 않는 습관이 중요합니다.';
    return '버튼 위치만 외우기보다 “왜 이 메뉴를 누르는지”를 함께 기억해야 응용이 쉬워져요.';
  }
  return '노션은 기능이 비슷해 보여도 위치와 쓰임이 조금씩 달라요. 막히면 큰 구조(페이지→블록→DB)를 다시 떠올리면 헷갈림이 줄어듭니다.';
}
function pointVisual(les){

        <div class="progress-label"><span>진도율</span><b>${Math.round(cExcel/14*100)}%</b> <span>${cExcel}/14강</span></div>
      </div>
      <div class="course-card cc-ielts" style="cursor:pointer" onclick="location.hash='course/ielts'">
        <div class="cc-icon">🇬🇧</div><h3>${COURSES.ielts.name}</h3><p class="cc-sub">${COURSES.ielts.tagline}</p>
        <div class="progress"><i style="width:${Math.round(cIelts/100*100)}%"></i></div>
        <div class="progress-label"><span>진도율</span><b>${Math.round(cIelts/100*100)}%</b> <span>${cIelts}/100강</span></div>
      </div>
    </div>`;
    return html;
  }
};

/* ── 미니 달력 ── */
function miniCal(y, m){
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const days = new Date(y, m+1, 0).getDate();
  const todayStrK = todayStr();
  const todayD = new Date();
  let html = `<div class="cal-dow">${['일','월','화','수','목','금','토'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-grid">`;
  for(let i=0;i<startDow;i++) html += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=days; d++){
    const key = y+'-'+pad(m+1)+'-'+pad(d);
    const isToday = key===todayStrK;
    const isDone = doneDates().includes(key);
    const isWeekend = [0,6].includes(new Date(y,m,d).getDay());
    html += `<div class="cal-cell ${isDone?'done':''} ${isToday?'today':''} ${isWeekend?'weekend':''}">${d}</div>`;
  }
  html += `</div>`;
  return html;
}

/* ── 큰 달력 ── */
function bigCal(y, m, isThisMonth){
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const days = new Date(y, m+1, 0).getDate();
  const todayKey = todayStr();
  const domArr = ['일','월','화','수','목','금','토'];
  const dayDoneMap = {};
  Object.keys(done).forEach(lid=>{
    const cid = lid.startsWith('n') ? 'notion' : (lid.startsWith('i') ? 'ielts' : 'excel');
    const date = done[lid];
    (dayDoneMap[date] = dayDoneMap[date] || []).push({cid, title: (COURSES[cid]? flatLessons(cid).find(l=>l.id===lid) : null)});
  });
  let html = `<div class="dow">${domArr.map(d=>`<span>${d}</span>`).join('')}</div><div class="grid">`;
  for(let i=0;i<startDow;i++) html += `<div class="day out"></div>`;
  for(let d=1; d<=days; d++){
    const key = y+'-'+pad(m+1)+'-'+pad(d);
    const marks = dayDoneMap[key] || [];
    const isToday = key===todayKey;
    const isWeekend = [0,6].includes(new Date(y,m,d).getDay());
    html += `<div class="day ${marks.length?'done':''} ${isToday?'today':''} ${isWeekend&&!marks.length?'':''}">
      <span class="d-n">${d}</span>
      ${isWeekend?'<span class="d-wk">'+domArr[new Date(y,m,d).getDay()]+'</span>':''}
      <div class="d-marks">${marks.map(mk=>`<span class="mk ${mk.cid==='notion'?'n':(mk.cid==='ielts'?'i':'x')}">${mk.title ? mk.title.split('·')[0] : mk.cid}</span>`).join('')}</div>
    </div>`;
  }
  const tail = (startDow+days)%7; if(tail) for(let i=tail;i<7;i++) html += `<div class="day out"></div>`;
  html += `</div>`;
  return html;
}
function calMove(n){ calOffset += n; route(); }

/* ── 최근 기록 ── */
function recentLog(){
  const entries = Object.entries(done).map(([lid,date])=>{
    const cid = lid.startsWith('n') ? 'notion' : (lid.startsWith('i') ? 'ielts' : 'excel');
    const title = (flatLessons(cid).find(l=>l.id===lid)||{}).title || lid;
    return {date, cid, title};
  }).sort((a,b)=> b.date.localeCompare(a.date)).slice(0,5);
  if(!entries.length) return `<div style="padding:18px 4px;color:var(--sub);font-size:14px">아직 공부 기록이 없어요.<br>첫 수업을 완료해 보세요! ✨</div>`;
  const dmap = {notion:'📄', excel:'📊', ielts:'🇬🇧'};
  return entries.map(e=>`
    <div class="recent-row">
      <span class="r-date">${e.date.slice(5).replace('-','.')}</span>
      <span class="r-dot" style="background:${e.cid==='notion'?'var(--primary)':(e.cid==='ielts'?'var(--ielts)':'var(--excel)')}"></span>
      <span class="r-title">${e.title}</span>
      <span class="r-course ${e.cid}">${dmap[e.cid]} ${COURSES[e.cid].name}</span>
    </div>`).join('');
}

/* ── 완료 토글 ── */
function toggleDone(cid, lid){
  const isN = cid==='notion';
  if(done[lid]){
    delete done[lid];
    save();
    toast('완료를 취소했어요. 달력 기록도 함께 지워졌어요.');
  } else {
    done[lid] = todayStr();
    save();
    toast(`✓ <b>수강 완료!</b> ${fmtDate(todayStr())}이 달력에 기록됐어요.`);
  }
  route();
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

route();
</script>
